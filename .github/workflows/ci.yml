          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          node --experimental-strip-types scripts/ci-cacheable-experiment-identity.mts \
            --commit-sha "$VERIFICATION_CANDIDATE" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --base "$VERIFICATION_BASE" --head "$VERIFICATION_CANDIDATE" --pull-request-head "$VERIFICATION_HEAD" \
            --profile "$VERIFICATION_PROFILE" --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
            --runner-label ubuntu-latest --pnpm-version "$(pnpm --version)" \
            --output ci-reports/cacheable-ci/identity.json
          input_digest=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("ci-reports/cacheable-ci/identity.json", "utf8")).inputDigest)')
          echo "input_digest=$input_digest" >> "$GITHUB_OUTPUT"
      - name: Restore exact package artifact receipts
        id: exact_receipts
        if: env.CROCO_CACHEABLE_FAILURE_CLASS == 'none' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/exact/package-artifacts
          key: ci-lane-receipt-v1-${{ runner.os }}-package-artifacts-${{ needs.changes.outputs.profile }}-${{ steps.split_identity.outputs.input_digest }}
      - name: Run package artifacts producer
        env:
          EXACT_CACHE_HIT: ${{ steps.exact_receipts.outputs.cache-hit }}
          TRUSTED_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          cache_args=()
          lane_args=(--allow-pending-release-metadata)
          failure_args=()
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" != "none" ]; then
            failure_args+=(--full-selection)
          fi
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" = "package-artifacts" ]; then
            failure_args+=(--inject-failure "$CROCO_CACHEABLE_FAILURE_CLASS")
          elif [ "$CROCO_CACHEABLE_FAILURE_CLASS" = "none" ] && [ "$TRUSTED_CACHE" = "true" ]; then
            cache_args+=(--cache-dir .ci-cache/exact/package-artifacts)
            if [ "$EXACT_CACHE_HIT" = "true" ]; then
              cache_args+=(--cache-origin github-exact-key)
            fi
          fi
          node --experimental-strip-types scripts/ci-cacheable-lane-runner.mts \
            --identity ci-reports/cacheable-ci/identity.json --lane package-artifacts \
            --profile "$VERIFICATION_PROFILE" --root . --base "$VERIFICATION_BASE" --head "$VERIFICATION_CANDIDATE" \
            "${lane_args[@]}" \
            "${failure_args[@]}" \
            "${cache_args[@]}"
      - name: Upload package artifacts producer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lane-package-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/cacheable-ci/package-artifacts
          if-no-files-found: error
          retention-days: 90

  coverage-security:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NPM_CONFIG_PROVENANCE: "true"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate checkout
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
        run: >-
          node --experimental-strip-types scripts/ci-verification-identity.mts assert
          --event "$GITHUB_EVENT_NAME" --base "$VERIFICATION_BASE" --head "$VERIFICATION_HEAD"
          --candidate "$VERIFICATION_CANDIDATE" --checkout HEAD
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Restore producer Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-coverage-security-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-coverage-security-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create split verification identity
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          node --experimental-strip-types scripts/ci-cacheable-experiment-identity.mts \
            --commit-sha "$VERIFICATION_CANDIDATE" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --base "$VERIFICATION_BASE" --head "$VERIFICATION_CANDIDATE" --pull-request-head "$VERIFICATION_HEAD" \
            --profile "$VERIFICATION_PROFILE" --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
            --runner-label ubuntu-latest --pnpm-version "$(pnpm --version)" \
            --output ci-reports/cacheable-ci/identity.json
      - name: Capture physical security evidence
        id: physical_security
        shell: bash
        run: |
          mkdir -p ci-reports/security
          set +e
          pnpm audit:prod > ci-reports/security/pnpm-audit-prod.txt 2>&1
          audit_exit=$?
          pnpm security:gitleaks-smoke > ci-reports/security/gitleaks-smoke.txt 2>&1
          smoke_exit=$?
          : > ci-reports/security/gitleaks.txt
          printf '%s\n' '{"version":"2.1.0","runs":[]}' > ci-reports/security/gitleaks.sarif
          docker run --rm -v "$PWD:/repo" "${{ env.GITLEAKS_IMAGE }}" detect --source /repo --redact --no-banner --log-opts=HEAD --report-format sarif --report-path /repo/ci-reports/security/gitleaks.sarif > ci-reports/security/gitleaks.txt 2>&1
          scan_exit=$?
          set -e
          {
            echo "audit_exit=$audit_exit"
            echo "smoke_exit=$smoke_exit"
            echo "scan_exit=$scan_exit"
          } >> "$GITHUB_OUTPUT"
          node --experimental-strip-types scripts/ci-cacheable-security-evidence.mts \
            --advisory-audit-exit-code "$audit_exit" \
            --gitleaks-smoke-exit-code "$smoke_exit" \
            --secret-scan-exit-code "$scan_exit" \
            --output ci-reports/security/security-physical.json
      - name: Run coverage and security producer
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          lane_args=(--allow-pending-release-metadata)
          failure_args=()
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" != "none" ]; then
            failure_args+=(--full-selection)
          fi
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" = "coverage-security" ]; then
            failure_args+=(--inject-failure "$CROCO_CACHEABLE_FAILURE_CLASS")
          fi
          node --experimental-strip-types scripts/ci-cacheable-lane-runner.mts \
            --identity ci-reports/cacheable-ci/identity.json --lane coverage-security \
            --profile "$VERIFICATION_PROFILE" --root . --base "$VERIFICATION_BASE" --head "$VERIFICATION_CANDIDATE" \
            --security-results ci-reports/security/security-physical.json \
            --security-artifact ci-reports/security/security-physical.json \
            --security-artifact ci-reports/security/pnpm-audit-prod.txt \
            --security-artifact ci-reports/security/gitleaks-smoke.txt \
            --security-artifact ci-reports/security/gitleaks.txt \
            --security-artifact ci-reports/security/gitleaks.sarif \
            "${lane_args[@]}" \
            "${failure_args[@]}"
      - name: Report advisory physical security failures
        if: always()
        env:
          SMOKE_EXIT: ${{ steps.physical_security.outputs.smoke_exit }}
          SCAN_EXIT: ${{ steps.physical_security.outputs.scan_exit }}
        run: |
          echo "This shadow lane is advisory; validate retains the blocking Gitleaks checks."
          {
            echo "- Advisory Gitleaks smoke exit code: ${SMOKE_EXIT:-unknown}"
            echo "- Advisory secret scan exit code: ${SCAN_EXIT:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage and security producer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lane-coverage-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/cacheable-ci/coverage-security
          if-no-files-found: error
          retention-days: 90

  split-validation-shadow:
    needs: [changes, core-verification, generated-apps, package-artifacts, coverage-security]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && needs.changes.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate checkout
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
        run: >-
          node --experimental-strip-types scripts/ci-verification-identity.mts assert
          --event "$GITHUB_EVENT_NAME" --base "$VERIFICATION_BASE" --head "$VERIFICATION_HEAD"
          --candidate "$VERIFICATION_CANDIDATE" --checkout HEAD
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create split verification identity
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          node --experimental-strip-types scripts/ci-cacheable-experiment-identity.mts \
            --commit-sha "$VERIFICATION_CANDIDATE" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --base "$VERIFICATION_BASE" --head "$VERIFICATION_CANDIDATE" --pull-request-head "$VERIFICATION_HEAD" \
            --profile "$VERIFICATION_PROFILE" --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
            --runner-label ubuntu-latest --pnpm-version "$(pnpm --version)" \
            --output ci-reports/cacheable-ci/identity.json
      - name: Download core verification producer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-lane-core-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/core-verification
      - name: Download generated apps producer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-lane-generated-apps-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/generated-apps
      - name: Download package artifacts producer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-lane-package-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/package-artifacts
      - name: Download coverage and security producer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-lane-coverage-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/coverage-security
      - name: Assemble immutable split verification input
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
        run: |
          selection_args=()
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" != "none" ]; then
            selection_args+=(--full-selection)
          fi
          node --experimental-strip-types scripts/ci-synthesis-input.mts \
            --identity ci-reports/cacheable-ci/identity.json \
            --base "$VERIFICATION_BASE" --head "$VERIFICATION_CANDIDATE" \
            --producer-dir core-verification=incoming/core-verification \
            --producer-dir generated-apps=incoming/generated-apps \
            --producer-dir package-artifacts=incoming/package-artifacts \
            --producer-dir coverage-security=incoming/coverage-security \
            --output ci-reports/cacheable-ci/synthesis-input.json \
            "${selection_args[@]}"
      - name: Synthesize split verification shadow
        run: |
          failure_args=()
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" = "validate-synthesis" ]; then
            failure_args+=(--inject-failure "$CROCO_CACHEABLE_FAILURE_CLASS")
          fi
          node --experimental-strip-types scripts/ci-split-validation-synthesis.mts \
            --input ci-reports/cacheable-ci/synthesis-input.json \
            --output ci-reports/cacheable-ci/split-validation-shadow.json \
            "${failure_args[@]}"
      - name: Upload split validation shadow evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lane-split-validation-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-reports/cacheable-ci/synthesis-input.json
            ci-reports/cacheable-ci/split-validation-shadow.json
            ci-reports/package-quality
            ci-reports/security/split-security-policy-summary.json
          if-no-files-found: error
          retention-days: 90

  ecosystem-advisory:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.profile != 'repo'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run create-croco-app ecosystem-advisory generated app smoke
        id: generated_app_smoke_advisory
        continue-on-error: true
        run: pnpm create-croco-app:smoke -- --tier ecosystem-advisory

      - name: Publish ecosystem-advisory generated app smoke summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-reports/generated-apps/ecosystem-advisory-matrix.md ]; then
            cat ci-reports/generated-apps/ecosystem-advisory-matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ecosystem-advisory generated app smoke report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ecosystem-advisory generated app smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-app-smoke-ecosystem-advisory
          path: |
            ci-reports/generated-apps/ecosystem-advisory-matrix.md
            ci-reports/generated-apps/ecosystem-advisory-matrix.json
          if-no-files-found: warn

      - name: Upload ecosystem-advisory generated app smoke failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-app-smoke-ecosystem-advisory-failure-artifacts
          path: ci-reports/generated-apps/cases
          include-hidden-files: true
          if-no-files-found: ignore

  real-resource-tests:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.real-resources == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      membership-postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_DB: croco_membership
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d croco_membership"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify persistence concurrency against PostgreSQL
        env:
          CREDITS_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/croco_membership
          ENGAGEMENT_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/croco_membership
          ENTITLEMENTS_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/croco_membership
          EXECUTION_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/croco_membership
          MEMBERSHIP_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/croco_membership
        run: |
          pnpm build --filter=@croco/credits-drizzle...
          pnpm --filter @croco/credits-drizzle test:postgres
          pnpm build --filter=@croco/engagement-drizzle...
          pnpm --filter @croco/engagement-drizzle test:postgres
          pnpm build --filter=@croco/entitlements-drizzle...
          pnpm --filter @croco/entitlements-drizzle test:postgres
          pnpm build --filter=@croco/membership-drizzle...
          pnpm --filter @croco/membership-drizzle exec vitest run src/tests/DrizzleMembershipStore.postgres.spec.ts
          pnpm build --filter=@croco/execution-drizzle...
          pnpm --filter @croco/execution-drizzle test:postgres

      - name: Verify fresh migration status against PostgreSQL
        env:
          MIGRATION_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/croco_membership
        run: pnpm --filter @croco/migration-runner exec vitest run src/tests/MigrationStatusPostgres.spec.ts

      - name: Verify API key rotation atomicity against PostgreSQL
        env:
          AUTH_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/croco_membership
        run: |
          pnpm build --filter=@croco/auth-drizzle...
          pnpm --filter @croco/auth-drizzle exec vitest run src/tests/DrizzleApiKeyStore.postgres.spec.ts

      - name: Verify typed TestKernel resources against real PostgreSQL and Redis
        run: |
          pnpm build --filter=@croco/testing-resources...
          pnpm --filter @croco/testing-resources test:real
          pnpm build --filter=@croco/metering-core...
          pnpm --filter @croco/metering-core test:real
          pnpm build --filter=@croco/metrics-core...
          pnpm --filter @croco/metrics-core test:real

  windows-scaffold:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.windows-scaffold == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

