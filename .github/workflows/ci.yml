      - name: Run packed CLI from a path containing spaces
        shell: pwsh
        run: |
          $packDir = Join-Path $env:RUNNER_TEMP "croco packed cli"
          $runnerDir = Join-Path $env:RUNNER_TEMP "croco packed runner"
          $targetDir = Join-Path $runnerDir "generated-app"
          New-Item -ItemType Directory -Force -Path $packDir, $runnerDir | Out-Null
          pnpm --filter create-croco-app pack --pack-destination $packDir
          if ($LASTEXITCODE -ne 0) { throw "create-croco-app pack failed" }
          $tarball = Get-ChildItem -Path $packDir -Filter "*.tgz" | Select-Object -First 1
          if ($null -eq $tarball) { throw "create-croco-app tarball was not created" }
          tar -xf $tarball.FullName -C $runnerDir
          if ($LASTEXITCODE -ne 0) { throw "packed create-croco-app extraction failed" }
          $packageDir = Join-Path $runnerDir "package"
          $cliDependencies = Join-Path $env:GITHUB_WORKSPACE "packages/create-croco-app/node_modules"
          $packedNodeModules = Join-Path $packageDir "node_modules"
          New-Item -ItemType Directory -Force -Path $packedNodeModules | Out-Null
          $packedManifest = Get-Content (Join-Path $packageDir "package.json") | ConvertFrom-Json
          foreach ($dependency in $packedManifest.dependencies.PSObject.Properties.Name) {
            $source = Get-Item (Join-Path $cliDependencies $dependency)
            $resolvedSource = $source.ResolveLinkTarget($true)
            if ($null -eq $resolvedSource) { $resolvedSource = $source }
            $destination = Join-Path $packedNodeModules $dependency
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            New-Item -ItemType Junction -Path $destination -Target $resolvedSource.FullName | Out-Null
          }
          node (Join-Path $packageDir "dist/bin.js") $targetDir --preset blank --scope '@windows-smoke' --no-install --no-git --json
          if ($LASTEXITCODE -ne 0) { throw "packed create-croco-app generation failed" }
          if (-not (Test-Path (Join-Path $targetDir "package.json"))) {
            throw "packed create-croco-app did not generate package.json"
          }

      - name: Validate generated SaaS application
        env:
          CROCO_GENERATED_SMOKE_CASES: goal-saas-api
        run: pnpm create-croco-app:smoke

  docs-sync-check:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful change classification
        shell: bash
        env:
          CHANGE_CLASSIFICATION_RESULT: ${{ needs.changes.result }}
          API_SOURCE_RESULT: ${{ needs.changes.outputs.api-source }}
        run: |
          if [ "$CHANGE_CLASSIFICATION_RESULT" != "success" ]; then
            echo "::error::Change classification concluded $CHANGE_CLASSIFICATION_RESULT; docs-sync-check cannot authorize this revision."
            exit 1
          fi
          if [ "$API_SOURCE_RESULT" != "true" ] && [ "$API_SOURCE_RESULT" != "false" ]; then
            echo "::error::API source classification is missing or invalid; docs-sync-check cannot authorize this revision."
            exit 1
          fi
      - name: Record documentation contract applicability
        if: needs.changes.outputs.api-source != 'true'
        run: echo "No API documentation source changed; the documentation drift build is not applicable."
      - name: Checkout
        if: needs.changes.outputs.api-source == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate checkout
        if: needs.changes.outputs.api-source == 'true'
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
        run: >-
          node --experimental-strip-types scripts/ci-verification-identity.mts assert
          --event "$GITHUB_EVENT_NAME" --base "$VERIFICATION_BASE" --head "$VERIFICATION_HEAD"
          --candidate "$VERIFICATION_CANDIDATE" --checkout HEAD
      - name: Setup pnpm
        if: needs.changes.outputs.api-source == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        if: needs.changes.outputs.api-source == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Restore Turbo cache
        if: needs.changes.outputs.api-source == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        if: needs.changes.outputs.api-source == 'true'
        run: pnpm install --frozen-lockfile
      - name: Reverify immutable candidate worktree
        if: needs.changes.outputs.api-source == 'true'
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
        run: >-
          node --experimental-strip-types scripts/ci-verification-identity.mts assert
          --event "$GITHUB_EVENT_NAME" --base "$VERIFICATION_BASE" --head "$VERIFICATION_HEAD"
          --candidate "$VERIFICATION_CANDIDATE" --checkout HEAD --worktree
      - name: Build docs and check for drift
        if: needs.changes.outputs.api-source == 'true'
        run: pnpm docs:api:check

  docs-build:
    needs: [changes, docs-sync-check]
    if: ${{ needs.changes.outputs.docs == 'true' || (github.event_name != 'pull_request' && needs.changes.outputs.api-source == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-docs-sync-check-${{ github.sha }}
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: >-
          pnpm turbo run docs:build --cache=local:rw --cache-dir=.turbo/cache
          --env-mode=strict --summarize

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: packages/docs/dist

  docs-links:
    needs: [changes, docs-build]
    if: ${{ needs.changes.outputs.docs == 'true' || (github.event_name != 'pull_request' && needs.changes.outputs.api-source == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: packages/docs/dist

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Exclusions are intentionally narrow: the repository landing URL is
          # canonical, current-commit blob/tree links are generated docs anchors,
          # your-org/croco is scaffold placeholder text, archived OpenAI API docs
          # return transient 503s from Wayback, diataxis.fr rate-limits automated
          # docs link checks, and packages/docs is a private docs app
          # rather than a public package README.
          args: >-
            --verbose
            --no-progress
            --root-dir '${{ github.workspace }}/packages/docs/dist'
            --exclude '^https://github\.com/croco-dev/framework(#readme)?$'
            --exclude '^https://github\.com/croco-dev/framework/(blob|tree)/[0-9a-f]{40}/'
            --exclude '^https://github\.com/your-org/croco(#readme)?$'
            --exclude '^https://web\.archive\.org/web/[0-9]+/https://developers\.openai\.com/api/'
            --exclude '^https://diataxis\.fr/(how-to-guides|reference)/$'
            --exclude-path '(^|/)packages/docs/README\.md$'
            'README.md'
            'docs/**/*.md'
            'packages/*/README.md'
            'packages/docs/dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
