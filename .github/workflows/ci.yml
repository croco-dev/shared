  core-verification:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate checkout
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
        run: >-
          node --experimental-strip-types scripts/ci-verification-identity.mts assert
          --event "$GITHUB_EVENT_NAME" --base "$VERIFICATION_BASE" --head "$VERIFICATION_HEAD"
          --candidate "$VERIFICATION_CANDIDATE" --checkout HEAD
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Restore producer Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-core-verification-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-core-verification-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir packages/docs run playwright:install
      - name: Create split verification identity
        id: split_identity
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          node --experimental-strip-types scripts/ci-cacheable-experiment-identity.mts \
            --commit-sha "$VERIFICATION_CANDIDATE" \
            --base "$VERIFICATION_BASE" \
            --head "$VERIFICATION_CANDIDATE" \
            --pull-request-head "$VERIFICATION_HEAD" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --profile "$VERIFICATION_PROFILE" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --runner-label ubuntu-latest \
            --pnpm-version "$(pnpm --version)" \
            --output ci-reports/cacheable-ci/identity.json
          input_digest=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("ci-reports/cacheable-ci/identity.json", "utf8")).inputDigest)')
          echo "input_digest=$input_digest" >> "$GITHUB_OUTPUT"
      - name: Restore exact core verification receipts
        id: exact_receipts
        if: env.CROCO_CACHEABLE_FAILURE_CLASS == 'none' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/exact/core-verification
          key: ci-lane-receipt-v1-${{ runner.os }}-core-verification-${{ needs.changes.outputs.profile }}-${{ steps.split_identity.outputs.input_digest }}
      - name: Run core verification producer
        env:
          EXACT_CACHE_HIT: ${{ steps.exact_receipts.outputs.cache-hit }}
          TRUSTED_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          cache_args=()
          lane_args=(--allow-pending-release-metadata)
          failure_args=()
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" != "none" ]; then
            failure_args+=(--full-selection)
          fi
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" = "core-verification" ]; then
            failure_args+=(--inject-failure "$CROCO_CACHEABLE_FAILURE_CLASS")
          elif [ "$CROCO_CACHEABLE_FAILURE_CLASS" = "none" ] && [ "$TRUSTED_CACHE" = "true" ]; then
            cache_args+=(--cache-dir .ci-cache/exact/core-verification)
            if [ "$EXACT_CACHE_HIT" = "true" ]; then
              cache_args+=(--cache-origin github-exact-key)
            fi
          fi
          node --experimental-strip-types scripts/ci-cacheable-lane-runner.mts \
            --identity ci-reports/cacheable-ci/identity.json \
            --lane core-verification \
            --profile "$VERIFICATION_PROFILE" \
            --root . \
            --base "$VERIFICATION_BASE" \
            --head "$VERIFICATION_CANDIDATE" \
            "${lane_args[@]}" \
            "${failure_args[@]}" \
            "${cache_args[@]}"
      - name: Upload core verification producer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-lane-core-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/cacheable-ci/core-verification
          if-no-files-found: error
          retention-days: 90

