name: CI

on:
  pull_request:
    branches:
      - trunk
  push:
    branches:
      - trunk
  workflow_dispatch:
    inputs:
      cacheable_failure_class:
        description: Cacheable CI equivalence failure class
        required: true
        default: none
        type: choice
        options:
          - none
          - core-verification
          - generated-apps
          - package-artifacts
          - coverage-security
          - validate-synthesis

permissions:
  contents: read

env:
  # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.23.0@sha256:b4b81841085b4060054a71155500a340e3d2e2a5995c186546649e3efd80b84e
  CROCO_CACHEABLE_FAILURE_CLASS: ${{ inputs.cacheable_failure_class || 'none' }}

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  repository-contracts:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable candidate checkout
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
        run: >-
          node --experimental-strip-types scripts/ci-verification-identity.mts assert
          --event "$GITHUB_EVENT_NAME"
          --base "$VERIFICATION_BASE"
          --head "$VERIFICATION_HEAD"
          --candidate "$VERIFICATION_CANDIDATE"
          --checkout HEAD
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check authoritative test inventory
        run: pnpm test-inventory:check
      - name: Check verification policy
        run: pnpm verification-policy:check
      - name: Run repository contract tests
        run: >-
          pnpm exec vitest run
          scripts/tests/test-inventory.spec.ts
          scripts/tests/verification-policy.spec.ts
          scripts/tests/branch-protection-policy.spec.ts
          scripts/tests/ci-workflow.spec.ts
          scripts/tests/ci-verification-identity.spec.ts
          scripts/tests/benchmark-workflow.spec.ts
          scripts/tests/repository-policy-audit-workflow.spec.ts

  validate:
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # The verification profile has a 150-minute internal budget; leave 30 minutes
    # for setup, changed-test shadow checks, and evidence publication.
    timeout-minutes: 180
    env:
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Require successful change classification
        shell: bash
        env:
          CHANGE_CLASSIFICATION_RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$CHANGE_CLASSIFICATION_RESULT" != "success" ]; then
            echo "::error::Change classification concluded $CHANGE_CLASSIFICATION_RESULT; validate cannot authorize this revision."
            exit 1
          fi

      - name: Start validate performance measurement
        shell: bash
        run: echo "CROCO_VALIDATE_MEASUREMENT_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable candidate checkout
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
        run: >-
          node --experimental-strip-types scripts/ci-verification-identity.mts assert
          --event "$GITHUB_EVENT_NAME"
          --base "$VERIFICATION_BASE"
          --head "$VERIFICATION_HEAD"
          --candidate "$VERIFICATION_CANDIDATE"
          --checkout HEAD

      - name: Initialize beta spine promotion evidence
        env:
          SPINE_PROMOTION_COMMIT_SHA: ${{ github.sha }}
          SPINE_PROMOTION_RUN_ATTEMPT: ${{ github.run_attempt }}
          SPINE_PROMOTION_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ci-reports/package-quality
          node -e 'const fs = require("node:fs"); fs.writeFileSync("ci-reports/package-quality/spine-promotion-run.json", JSON.stringify({ commitSha: process.env.SPINE_PROMOTION_COMMIT_SHA, runId: process.env.SPINE_PROMOTION_RUN_ID, runAttempt: process.env.SPINE_PROMOTION_RUN_ATTEMPT, startedAt: new Date().toISOString() }, null, 2) + "\n")'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --dir packages/docs run playwright:install

      - name: Production dependency audit report
        id: security_audit_advisory
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p ci-reports/security
          start=$(date +%s)
          set +e
          pnpm audit:prod > ci-reports/security/pnpm-audit-prod.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::pnpm audit:prod reported production vulnerabilities. CI keeps the raw audit advisory-only and uploads security-report; release publish gates run pnpm security:audit-policy as the blocker."
          fi
          exit "$exit_code"

      - name: Security Gitleaks acceptance smoke
        run: pnpm security:gitleaks-smoke

      - name: Secret scan blocking report
        id: security_gitleaks
        if: always()
        shell: bash
        run: |
          mkdir -p ci-reports/security
          : > ci-reports/security/gitleaks.txt
          printf '%s\n' '{"version":"2.1.0","runs":[]}' > ci-reports/security/gitleaks.sarif
          start=$(date +%s)
          set +e
          docker run --rm -v "$PWD:/repo" "${{ env.GITLEAKS_IMAGE }}" detect --source /repo --redact --no-banner --log-opts=HEAD --report-format sarif --report-path /repo/ci-reports/security/gitleaks.sarif > ci-reports/security/gitleaks.txt 2>&1
          exit_code=$?
          set -e
          end=$(date +%s)
          duration=$((end - start))
          {
            echo "exit_code=$exit_code"
            echo "duration_seconds=$duration"
          } >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::Gitleaks secret scanning failed. Review the redacted SARIF/text report; remove findings from reachable history or use a reviewed exact fingerprint or bounded path. Scanner operational failures are also blocking."
          fi
          node --experimental-strip-types scripts/security-gitleaks-smoke.mts --ensure-sarif ci-reports/security/gitleaks.sarif || exit_code=$?
          exit "$exit_code"

      - name: Assemble security policy summary
        if: always()
        shell: bash
        env:
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          mkdir -p ci-reports/security
          if [ "$VERIFICATION_PROFILE" = "publish" ]; then
            audit_policy_result="selected by the shared publish profile"
          else
            audit_policy_result="not selected by the $VERIFICATION_PROFILE profile"
          fi
          {
            echo "# Security policy summary"
            echo ""
            echo "- \`pnpm audit:prod\` dependency audit: advisory-only in CI on pull requests, trunk pushes, and manual runs"
            echo "- \`pnpm security:audit-policy\` dependency audit policy: blocks unreviewed runtime, generated-app, and release-evidence high-risk findings"
            echo "- \`pnpm security:audit-policy\` release enforcement: blocking in the Release workflow before publish"
            echo "- \`gitleaks\` secret scanning: blocking on pull requests, trunk pushes, and manual runs"
            echo "- Security allowlist metadata: blocking; audit and secret-scan exceptions require owner, reason, and reviewBy/expiresOn"
            echo "- Release path: release-triggering changes still pass through CI before merge; publish-specific gates live in the Release workflow"
            echo ""
            echo "## Current run"
            echo ""
            echo "- Audit advisory exit code: ${{ steps.security_audit_advisory.outputs.exit_code || 'unknown' }}"
            echo "- Audit advisory duration (seconds): ${{ steps.security_audit_advisory.outputs.duration_seconds || 'unknown' }}"
            echo "- Audit policy result: $audit_policy_result"
            echo "- Gitleaks exit code: ${{ steps.security_gitleaks.outputs.exit_code || 'unknown' }}"
            echo "- Gitleaks duration (seconds): ${{ steps.security_gitleaks.outputs.duration_seconds || 'unknown' }}"
            echo ""
            echo "## False positive management"
            echo ""
            echo "1. Review the SARIF/text finding and confirm the secret or dependency path is non-production or test-only data."
            echo "2. For confirmed false positives, add an exact fingerprint to \`.gitleaksignore\` or a fully anchored bounded path to \`.gitleaks.toml\`."
            echo "3. Add matching metadata in \`scripts/security-allowlist-metadata.json\` with owner, reason, and reviewBy/expiresOn."
            echo "4. Keep the entry scoped to the exact fingerprint or bounded path and document the reason in the pull request."
            echo ""
            echo "## Runtime impact"
            echo ""
            echo "- \`pnpm audit:prod\` advisory report reuses the existing dependency install and should add only the command runtime."
            echo "- \`pnpm security:audit-policy\` reuses the full lockfile audit output and local manifests without installing extra tooling."
            echo "- \`ghcr.io/gitleaks/gitleaks\` adds one cold-start image pull plus repository scan time; use the recorded duration above as the baseline for enforce decisions."
          } > ci-reports/security/summary.md
          cat ci-reports/security/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: ci-reports/security
          if-no-files-found: warn

      - name: Reverify immutable candidate worktree
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
        run: >-
          node --experimental-strip-types scripts/ci-verification-identity.mts assert
          --event "$GITHUB_EVENT_NAME"
          --base "$VERIFICATION_BASE"
          --head "$VERIFICATION_HEAD"
          --candidate "$VERIFICATION_CANDIDATE"
          --checkout HEAD
          --worktree

      - name: Run selected verification profile
        id: verification_profile
        shell: bash
        env:
          CROCO_TEST_EVIDENCE_DIR: ${{ github.workspace }}/ci-reports/test-evidence/records
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
          VERIFICATION_HEAD: ${{ needs.changes.outputs.head }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          args=(--profile "$VERIFICATION_PROFILE" --allow-pending-release-metadata)
          if [ "$VERIFICATION_PROFILE" = "spine" ]; then
            args+=(--output-dir ci-reports/release)
          else
            args+=(--output-dir "ci-reports/verification/${VERIFICATION_PROFILE}")
          fi
          args+=(--base "$VERIFICATION_BASE" --head "$VERIFICATION_CANDIDATE")
          args+=(--verification-base-sha "$VERIFICATION_BASE")
          args+=(--verification-head-sha "$VERIFICATION_HEAD")
          args+=(--verification-candidate-sha "$VERIFICATION_CANDIDATE")
          if [ "$CROCO_CACHEABLE_FAILURE_CLASS" != "none" ]; then
            args+=(--full-selection)
            args+=(--inject-failure "$CROCO_CACHEABLE_FAILURE_CLASS")
          fi
          node --experimental-strip-types scripts/release-spine-evidence.mts "${args[@]}"

      - name: Restore observed CI performance history
        if: always() && github.ref_name == 'trunk'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-reports/ci-performance/history.json
          key: ci-performance-history-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-performance-history-${{ runner.os }}-

      - name: Publish verification summary
        if: always()
        shell: bash
        env:
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          report="ci-reports/verification/${VERIFICATION_PROFILE}/spine-evidence.md"
          if [ "$VERIFICATION_PROFILE" = "spine" ]; then
            report="ci-reports/release/spine-evidence.md"
          fi
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verification report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure native Vitest evidence
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CROCO_TEST_EVIDENCE_DIR: ${{ github.workspace }}/ci-reports/test-evidence/records
        run: |
          if ! find ci-reports/test-evidence/records -type f -name 'vitest-*.json' -print -quit 2>/dev/null | grep -q .; then
            pnpm --filter @croco/testing test
          fi

      - name: Run full test suite for changed-test shadow
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          started_at=$(date +%s)
          mkdir -p ci-reports/changed-test-plan/full-evidence/records
          rm -f \
            ci-reports/changed-test-plan/full-fast-lane.json \
            ci-reports/changed-test-plan/full-evidence/records/full-suite-status.json
          full_suite_status=0
          shadow_source="executed full fast lane"
          if [ "$VERIFICATION_PROFILE" = "publish" ]; then
            shadow_source="reused publish verification fast lane"
            if [ -f ci-reports/package-quality/fast-test-lane.json ]; then
              cp \
                ci-reports/package-quality/fast-test-lane.json \
                ci-reports/changed-test-plan/full-fast-lane.json || full_suite_status=$?
            else
              echo "Publish fast lane evidence is missing; the verification fast lane did not run." >> "$GITHUB_STEP_SUMMARY"
              full_suite_status=1
            fi
          else
            set +e
            node --experimental-strip-types scripts/test-lane-runner.mts \
              --lane fast \
              --output ci-reports/changed-test-plan/full-fast-lane.json
            full_suite_status=$?
            set -e
          fi
          set +e
          node --experimental-strip-types scripts/changed-test-full-suite-status.mts \
            "$full_suite_status" \
            ci-reports/changed-test-plan/full-evidence/records/full-suite-status.json \
            ci-reports/changed-test-plan/full-fast-lane.json
          status_evidence_status=$?
          set -e
          if [ "$status_evidence_status" -ne 0 ]; then
            full_suite_status=$status_evidence_status
          fi
          elapsed_seconds=$(($(date +%s) - started_at))
          echo "Changed-test shadow full suite: ${elapsed_seconds}s on ${{ runner.os }}/${{ runner.arch }} (${shadow_source})." >> "$GITHUB_STEP_SUMMARY"
          exit "$full_suite_status"

      - name: Assert changed-test shadow evidence completeness
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          node --experimental-strip-types scripts/changed-test-full-suite-status.mts \
            --check ci-reports/changed-test-plan/full-fast-lane.json
          test -f ci-reports/changed-test-plan/full-evidence/records/full-suite-status.json

      - name: Restore changed-test shadow baseline
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-reports/changed-test-plan/baseline.json
          key: changed-test-plan-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            changed-test-plan-${{ github.event.pull_request.number }}-

      - name: Aggregate changed-test shadow full evidence
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          node --experimental-strip-types scripts/test-evidence-bundle.mts \
            --input ci-reports/changed-test-plan/full-evidence/records/full-suite-status.json \
            --output ci-reports/changed-test-plan/full-evidence

      - name: Measure changed-test selection misses
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && hashFiles('ci-reports/changed-test-plan/full-evidence/bundle.json') != '' }}
        env:
          VERIFICATION_BASE: ${{ needs.changes.outputs.base }}
          VERIFICATION_CANDIDATE: ${{ needs.changes.outputs.candidate }}
        run: |
          node --experimental-strip-types scripts/changed-test-plan-shadow.mts \
            --base "$VERIFICATION_BASE" \
            --head "$VERIFICATION_CANDIDATE" \
            --full-evidence ci-reports/changed-test-plan/full-evidence/bundle.json \
            --output ci-reports/changed-test-plan
          cat ci-reports/changed-test-plan/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Aggregate executable test evidence
        if: always()
        shell: bash
        env:
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          report="ci-reports/verification/${VERIFICATION_PROFILE}/spine-evidence.json"
          if [ "$VERIFICATION_PROFILE" = "spine" ]; then
            report="ci-reports/release/spine-evidence.json"
          fi
          evidence_args=(--input "$report")
          vitest_record_count=0
          if [ -d ci-reports/test-evidence/records ]; then
            while IFS= read -r evidence_record; do
              evidence_args+=(--input "$evidence_record")
              if [[ "$evidence_record" == */vitest-*.json ]]; then
                vitest_record_count=$((vitest_record_count + 1))
              fi
            done < <(find ci-reports/test-evidence/records -type f -name '*.json' -print | sort)
          fi
          if [ "$vitest_record_count" -eq 0 ]; then
            evidence_args+=(--input ci-reports/test-evidence/records/required-vitest-record.json)
          fi
          evidence_status=0
          node --experimental-strip-types scripts/test-evidence-bundle.mts "${evidence_args[@]}" || evidence_status=$?
          if [ -f ci-reports/test-evidence/summary.md ]; then
            cat ci-reports/test-evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Test evidence summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$evidence_status"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ needs.changes.outputs.profile }}
          path: |
            ci-reports/verification
            ci-reports/release
            ci-reports/test-evidence
            ci-reports/changed-test-plan
          include-hidden-files: true
          if-no-files-found: warn

      - name: Publish spine-blocking generated app smoke summary
        if: always()
        shell: bash
        run: |
          for report in spine-blocking-matrix.md spine-blocking-journeys/report.md; do
            if [ -f "ci-reports/generated-apps/${report}" ]; then
              cat "ci-reports/generated-apps/${report}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Generated app smoke ${report} was not generated." >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload spine-blocking generated app smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-app-smoke-spine-blocking
          path: |
            ci-reports/generated-apps/spine-blocking-matrix.md
            ci-reports/generated-apps/spine-blocking-matrix.json
            ci-reports/generated-apps/spine-blocking-journeys
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload spine-blocking generated app smoke failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-app-smoke-spine-blocking-failure-artifacts
          path: ci-reports/generated-apps/cases
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload package quality dashboard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-quality-dashboard
          path: ci-reports/package-quality
          if-no-files-found: warn

      - name: Publish core coverage warning summary
        if: always()
        shell: bash
        run: |
          if [ -f ci-reports/coverage/core-warning/report.md ]; then
            cat ci-reports/coverage/core-warning/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Core coverage warning report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Complete validate performance measurement
        if: always()
        shell: bash
        run: echo "CROCO_VALIDATE_MEASUREMENT_COMPLETED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"

      - name: Record observed CI performance budget
        if: always()
        shell: bash
        env:
          CROCO_VALIDATE_JOB_CONCLUSION: ${{ job.status }}
          VERIFICATION_PROFILE: ${{ needs.changes.outputs.profile }}
        run: |
          report="ci-reports/verification/${VERIFICATION_PROFILE}/spine-evidence.json"
          if [ "$VERIFICATION_PROFILE" = "spine" ]; then
            report="ci-reports/release/spine-evidence.json"
          fi
          if [ ! -f "$report" ]; then
            echo "CI performance sample was not generated because verification evidence is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          history_args=()
          if [ -f ci-reports/ci-performance/history.json ]; then
            history_args+=(--input ci-reports/ci-performance/history.json)
          fi
          performance_status=0
          node --experimental-strip-types scripts/ci-performance-budget.mts \
            "${history_args[@]}" \
            --evidence "$report" \
            --measurement-started-at "$CROCO_VALIDATE_MEASUREMENT_STARTED_AT" \
            --measurement-completed-at "$CROCO_VALIDATE_MEASUREMENT_COMPLETED_AT" \
            --conclusion "$CROCO_VALIDATE_JOB_CONCLUSION" \
            --sample-output ci-reports/ci-performance/raw-sample.json \
            --history-output ci-reports/ci-performance/history.json \
            --json-output ci-reports/ci-performance/report.json \
            --markdown-output ci-reports/ci-performance/report.md \
            --pnpm-version "$(pnpm --version)" \
            --branch "$GITHUB_REF_NAME" \
            --job-id "$GITHUB_JOB" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --runner-label "ubuntu-latest" \
            --injected-failure "$CROCO_CACHEABLE_FAILURE_CLASS" \
            --enforce || performance_status=$?
          if [ -f ci-reports/ci-performance/report.md ]; then
            cat ci-reports/ci-performance/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CI performance report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$performance_status"

      - name: Upload observed CI performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/ci-performance
          if-no-files-found: warn
          retention-days: 90

      - name: Upload core coverage warning report
        if: always()
